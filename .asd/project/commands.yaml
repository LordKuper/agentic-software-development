# commands.yaml — machine-only SSoT for project build/test/run commands
# read by Dev, Tester, and review agents

test: "node tests/run.js"
lint: "git diff --cached --check"
build: "node .asd/sync.js --check"
run: "node .asd/hooks/session-start.js --provider codex"

# test_affected: intentionally omitted. `tests/run.js` loads `tests/<area>.test.js`; it has no
# changed-since flag, so the impacted set stays search-derived (sprint-lifecycle.md "Impacted test
# set") and runs as `node tests/run.js <area>…` over the areas that search selects.

test_paths: "tests/**"
test_durations: "node tests/run.js"

checks:
  context: "node .asd/runtime.js context-check"
  agnix: "npx --yes agnix@0.61.0 --strict -c .agnix.toml .claude .codex .agents AGENTS.md CLAUDE.md"

custom:
  sync-check: "node .asd/sync.js --check"
