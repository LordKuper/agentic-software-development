# ASD workflow configuration.
# Generated by /asd-init. Edit via /asd-init (diff mode) or manually.

# ASD developing itself through its own workflow. Absent field = disabled.
# Values: enabled | disabled. See .asd/rules/sprint-lifecycle.md "Self-hosting".
self_hosting: enabled

# Optional sprint documents and their persistent design-artifact counterpart.
# Absent group (old config) = every value enabled (current behavior unchanged).
# Absent field within an existing group = disabled (fail-closed).
# Lean framework-dev profile: only audit; PRD/UX/ADR/C4 add no value for a
# framework whose spec already lives in .asd/rules/ + this plan doc.
documents:
  audit: enabled       # <sprint>/audit.md
  prd: disabled         # design/prd.html + persistent requirements
  ux_spec: disabled     # ux-spec, design-system gate, design-md-delta
  adr: disabled          # adr.html + persistent ADR
  c4: disabled             # c4-full + persistent C4

# Language for user-facing interaction.
# chat — language used in chat responses and questions.
# docs — language used in user-facing artifacts (PRD, ADR, UX-spec, plan, reviews, sprint.md).
# Machine-readable files (state.json, config.yaml, settings.json) are always English caveman-style.
# Values: ru | en
language:
  chat: ru
  docs: en

# Backward compatibility policy for changes made by the workflow.
# strict    — public API/contracts never break.
# migration — breaking changes allowed with a documented migration path and deprecation notice.
# none      — free hand, breaking changes allowed without ceremony.
backward_compat: migration

review:
  # External review via the other provider's CLI (Codex CLI wrapped in a Claude
  # session, Claude CLI wrapped in a Codex session), performed in parallel with
  # internal reviewers. Values: enabled | disabled
  # Wrapped-CLI availability confirmed: codex-cli 0.150.1 on PATH.
  external_review: enabled

  # Maximum number of review iterations per severity level.
  # On iteration N, only issues of severity X or higher are considered.
  iterations_low: 1
  iterations_medium: 1
  iterations_high: 2
  iterations_critical: 3

project:
  # Subsystem decomposition. When enabled, persistent design docs are organized per subsystem.
  # When disabled, single project-wide docs.
  # Values: enabled | disabled
  # Framework repo is one cohesive workflow tree, not multiple subsystems.
  subsystem_decomposition: disabled

system:
  # Operating system of the developer machine, set by /asd-init.
  # Determines invocation pattern for external CLIs (Codex, gh, etc.).
  # Values: windows | linux | macos
  os: windows

  tools:
    # LikeC4 CLI for C4 architecture model rendering.
    # Required when project.diagram_tool: likec4. Not used (decomposition disabled).
    likec4: ""

    # @google/design.md tooling availability flag.
    # Not used — documents.ux_spec disabled, no DESIGN.md maintained for this repo.
    designmd: false

    # Codex CLI command path. Empty for default lookup (`codex` on all OSes).
    codex_command: ""

    # Claude CLI command path. Empty for default lookup (`claude` on all OSes).
    claude_command: ""

git:
  # Base branch for new sprint branches and PR target.
  base_branch: main

  # Sprint branch name pattern.
  # {n}    — sprint number, zero-padded to 3 digits (e.g. 001).
  # {slug} — kebab-case slug derived from sprint scope.
  branch_pattern: "sprint/{n}-{slug}"

  # Use gh CLI for PR creation. If false, workflow stops at push and prints PR-ready summary.
  gh_enabled: true

  # Automatically open PR after Definition of Done is met and user confirms.
  auto_pr: true
