user_gates: strict # adaptive | strict; hard gates always require user approval

# ASD workflow configuration.
# Generated by /asd-init. Edit only via /asd-init (diff mode).
# Enumerated fields declare their accepted values in an inline a | b comment.

# ASD developing itself through its own workflow. Absent field = disabled.
# See .asd/rules/sprint-lifecycle.md "Self-hosting".
self_hosting: disabled # enabled | disabled

# Cleanup phase after impl-review (dead-code removal checkpoint). Absent field = enabled.
cleanup: enabled # enabled | disabled

# Retro publishes this project's open `asd` rows as issues on the ASD repo (consumer only; ignored under self_hosting). Absent field = enabled.
upstream_issues: enabled # enabled | disabled

# Shared-infrastructure safety valve of the impacted test set. disabled = impl-test's suite gate and cleanup's verification skip it, and the pr gate accepts cleanup's green impacted verification. Absent field = enabled. Read live, never frozen per sprint.
safety_valve: enabled # enabled | disabled

# Optional sprint documents and their persistent docs counterpart.
# Defaults: see .asd/rules/sprint-lifecycle.md "Optional documents".
documents:
  audit: auto          # auto | always | off
  prd: enabled         # enabled | disabled; design/prd.html + persistent requirements
  ux_spec: enabled     # enabled | disabled; sprint ux-spec drafts and persistent ux-spec docs
  design_system: enabled # enabled | disabled; design-system gate, design-md-delta. Absent within an existing documents group = ux_spec value
  adr: enabled          # enabled | disabled; adr.html (sprint-scoped only; folds into existing persistent docs at design-promote)

# Language for user-facing interaction.
# chat — language used in chat responses and questions.
# docs — language used in user-facing artifacts (PRD, ADR, UX-spec, plan, reviews, sprint.md).
# Machine-readable files (state.json, config.yaml, settings.json) are always English caveman-style.
language:
  chat: en # ru | en
  docs: en # ru | en

# Backward compatibility policy for changes made by the workflow.
# strict    — public API/contracts never break.
# migration — breaking changes allowed with a documented migration path and deprecation notice.
# none      — free hand, breaking changes allowed without ceremony.
backward_compat: migration # strict | migration | none

review:
  # External review runs in parallel with internal reviewers.
  # Claude Code wraps Codex. Codex wraps Claude CLI by default.
  external_review: enabled # enabled | disabled

  # Named local Codex profile for external review under Codex. Empty retains the default CLI route.
  codex_profile: ""

  # Maximum number of review iterations per severity level.
  # On iteration N, only issues of severity X or higher are considered.
  # Defaults below mean: trivial issues get one shot, critical issues loop up to ten times.
  iterations_low: 1
  iterations_medium: 1
  iterations_high: 2
  iterations_critical: 10

project:
  # Subsystem decomposition. When enabled, persistent docs are organized per subsystem,
  # registered in docs/architecture/subsystems.md. When disabled, single project-wide docs.
  subsystem_decomposition: enabled # enabled | disabled

  # Allow Claude Design where the host offers it. Disabled selects local HTML mockups.
  claude_design: disabled # enabled | disabled

  # Diagram tool for architecture views. Any diagram also requires subsystem_decomposition: enabled.
  # none — no diagram written; the subsystem registry is unaffected
  # likec4 — text DSL in docs/architecture/c4/model/*.c4 + likec4 CLI builds dist/
  # mermaid — Mermaid block inline in docs/architecture/subsystems.md; no c4/ folder
  diagram_tool: likec4 # none | likec4 | mermaid

system:
  tools:
    # Codex CLI command path. Empty for default lookup (`codex` on all OSes).
    # Applies when external review uses Codex, including a named profile under Codex.
    codex_command: ""

    # Claude CLI command path. Empty for default lookup (`claude` on all OSes).
    # Applies when external review uses Claude CLI under Codex.
    claude_command: ""

git:
  # Base branch for new sprint branches and PR target.
  base_branch: main

  # Sprint branch name pattern.
  # {n}    — sprint number, zero-padded to 3 digits (e.g. 001).
  # {slug} — kebab-case slug derived from sprint scope.
  branch_pattern: "sprint/{n}-{slug}"

  # AI attribution in commits and PRs. Absent field = enabled.
  # disabled: sync keeps Claude Code's project `attribution` off and `commit-check` rejects Claude/Codex `Co-authored-by:` trailers.
  # enabled: sync drops the `attribution` it or the sprint-start check wrote to `.claude/settings.json` (recorded in `.asd/sync-state.json`); one set there by hand, or already there before either changed it, stays.
  ai_attribution: enabled # enabled | disabled
